name: Build

on:
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke-test package
        run: npm run check:package

      - name: Verify representative benchmark corpus
        run: npm run benchmark:corpus:verify
