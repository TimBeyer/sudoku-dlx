name: Benchmark Comment

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true

      - name: Create or update benchmark comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const marker = '<!-- sudoku-dlx-benchmark-results -->'
            const root = 'benchmark-results'
            const files = fs
              .readdirSync(root)
              .filter(name => name.startsWith('final-comparison-') && name.endsWith('.md'))
              .sort()

            if (files.length === 0) {
              core.warning('No benchmark comparison artifacts were found')
              return
            }

            const sections = files.map(name =>
              fs.readFileSync(path.join(root, name), 'utf8').slice(0, 14000)
            )
            const run = context.payload.workflow_run
            const issueNumber = run.pull_requests[0].number
            const body = [
              marker,
              '# Sudoku benchmark results',
              '',
              `Internal regression comparison for [workflow run ${run.id}](${run.html_url}).`,
              '',
              ...sections
            ].join('\n').slice(0, 60000)

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            })
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              })
            }
