name: Test

on:
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        runtime: [node-22, node-24, node-26, bun-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Parse runtime version
        id: version
        shell: bash
        run: echo "value=${RUNTIME#*-}" >> "$GITHUB_OUTPUT"
        env:
          RUNTIME: ${{ matrix.runtime }}

      - name: Set up Node.js
        if: startsWith(matrix.runtime, 'node-')
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.version.outputs.value }}
          cache: npm

      - name: Set up Node.js for Bun tooling
        if: startsWith(matrix.runtime, 'bun-')
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        if: startsWith(matrix.runtime, 'bun-')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.version.outputs.value }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage on Node.js
        if: startsWith(matrix.runtime, 'node-')
        run: npm run cover

      - name: Run tests on Bun
        if: startsWith(matrix.runtime, 'bun-')
        run: bun run test:bun

      - name: Upload coverage artifact
        if: matrix.runtime == 'node-22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage/
          if-no-files-found: error
